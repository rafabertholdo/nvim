onboarding = false

# Keep Herdr visually and behaviorally close to the existing tmux setup.
[theme]
name = "catppuccin"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
reload_config = "prefix+r"
new_tab = "prefix+c"
rename_tab = "prefix+comma"

# Match the vim-style tmux pane navigation bindings.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Match tmux's | (side-by-side) and - (stacked) split bindings.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Match the prefix-free Shift-arrow tab/window navigation bindings.
previous_tab = "shift+left"
next_tab = "shift+right"

[ui]
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false

# Draw a complete border around split panes.
pane_borders = "auto"
pane_outer_borders = true
pane_gaps = true

# tmux's status/window row is conventionally at the bottom.
tab_bar_position = "bottom"
